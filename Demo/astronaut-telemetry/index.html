[9,'td','Total dose','mSv','C',12.4,0,0,50,'p'],
[9,'dr','Dose rate','µSv/h','C',22,1.2,0,60,'p',[0,0,0,140]],
[9,'sp','Solar particles','pfu','C',.3,.04,-1,10,'q',[0,0,0,60]],
[9,'cr','Cosmic radiation','p/cm²/s','C',2.4,.08,1,4,'q'],
[9,'np','Neutron / particle exposure','µSv/h','C',5,.3,0,15,'q',[0,0,0,15]]];
const DEC={td:3,bmd:3,bto:2,load:2,sp:2,arr:1},PI=10,SI=30;
const MM=M.map(r=>({c:r[0],id:r[1],n:r[2],u:r[3],t:r[4],b:r[5],z:r[6],lo:r[7],hi:r[8],d:OV[r[1]]||RM[r[9]]||r[9],fx:r[10]||[0,0,0,0],x:r[5],v:r[5],h:[r[5]],l:0,nx:Math.ceil(Math.random()*(r[4]=='P'?PI:SI))})),B={};
MM.forEach(m=>B[m.id]=m);
const CS=MM.filter(m=>m.t=='C'),by=c=>MM.filter(m=>m.c==c);
let now=0,paused=false,ui=0,sel=0,pkt=null,mode='Rest';
const K=['act','str','slp','flr','grv','iso','rad'],S={},T={};K.forEach(k=>S[k]=T[k]=0);
const g=()=>(Math.random()+Math.random()+Math.random()-1.5)*1.6;
const fv=m=>m.id=='bp'?Math.round(m.v)+'/'+Math.round(m.v*.65):m.v.toFixed(DEC[m.id]??(m.b>=50?0:m.b>=10?1:m.b>=1?2:3));
const st=m=>{const v=m.v,e=(m.hi-m.lo)*.08;return v<m.lo||v>m.hi?2:v<m.lo+e||v>m.hi-e?1:0};
function pk(m){pkt={astronautId:'AST-001',category:CATS[m.c][1],metric:m.n,value:fv(m),unit:m.u,timestamp:new Date().toISOString(),device:DEV[m.d]+' (simulated)',measurementType:{C:'continuous',P:'periodic',S:'scheduled'}[m.t],status:['NORMAL','WATCH','ALERT'][st(m)]}}
const push=m=>{m.h.push(m.v);if(m.h.length>40)m.h.shift()};
function step(){now++;K.forEach(k=>S[k]+=(T[k]-S[k])*.15);
MM.forEach(m=>{
 if(m.id=='td')m.x+=B.dr.x*8e-5;
 else if(m.id=='ecg')m.x=60000/B.hr.x*(1+g()*.004);
 else{const tg=m.b+m.fx.reduce((a,f,i)=>a+f*S[K[i]],0)+(FX2[m.id]||[]).reduce((a,f,i)=>a+f*S[K[4+i]],0);m.x+=(tg-m.x)*.2+g()*m.z*(m.t=='C'?1:.4)}
 if(m.t=='C'){m.v=m.x;m.l=now;push(m)}
 else if(now>=m.nx){m.v=m.x+g()*m.z*.3;m.l=now;m.nx=now+(m.t=='P'?PI:SI);push(m);pk(m)}});
pk(CS[now%CS.length])}
const sp=(h,w=64,ht=20)=>{if(h.length<2)return'';const a=Math.min(...h),b=Math.max(...h),r=b-a||1;return `<svg class="sp" viewBox="0 0 ${w} ${ht}" preserveAspectRatio="none" style="width:${w>100?'100%':w+'px'};height:${ht}px"><polyline fill="none" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke" points="${h.map((y,i)=>(i*w/(h.length-1)).toFixed(1)+','+(ht-2-(y-a)/r*(ht-4)).toFixed(1)).join(' ')}"/></svg>`};
const nx=m=>m.t=='C'?'live':'next '+Math.max(0,m.nx-now)+'s';
const tg=m=>`<span class="tag t${m.t}">${{C:'CONT',P:'PERIODIC',S:'SCHEDULED'}[m.t]}</span>`;
const dot=m=>`<i class="d s${st(m)}"></i>`;
const U1=()=>'<div class="grid">'+CATS.map((c,i)=>`<section class="card"><h3>${c[0]} ${c[1]}</h3>`+by(i).map(m=>`<div class="row">${dot(m)}<span class="n">${m.n} ${tg(m)}</span><span class="val">${fv(m)} <small>${m.u}</small></span><span class="sl">${m.t=='C'?sp(m.h):'<small>'+nx(m)+'</small>'}</span></div>`).join('')+'</section>').join('')+'</div>';
const U2=()=>`<div class="split"><nav class="side">`+CATS.map((c,i)=>{const bad=by(i).filter(m=>st(m)>0).length;return `<button data-c="${i}" class="${sel==i?'on':''}">${c[0]} ${c[1]}<small>${bad?bad+' flagged':'all normal'}</small></button>`}).join('')+`</nav><div class="tiles">`+by(sel).map(m=>`<div class="card"><div class="mut">${m.n} ${tg(m)}</div><div class="big">${dot(m)} ${fv(m)} <small>${m.u}</small></div>${sp(m.h,220,48)}<small>${DEV[m.d]} · ${m.t=='C'?'streaming 1 Hz':nx(m)}</small></div>`).join('')+'</div></div>';
const U3=()=>'<div class="wrap"><table><thead><tr><th>Metric<th>Value<th>Mode<th>Device<th>Sample<th>Status</tr></thead>'+CATS.map((c,i)=>`<tbody><tr class="grp"><td colspan="6">${c[0]} ${c[1]}</tr>`+by(i).map(m=>`<tr><td>${m.n}<td class="val">${fv(m)} <small>${m.u}</small><td>${tg(m)}<td>${DEV[m.d]}<td>${m.t=='C'?'live':(now-m.l)+'s ago · '+nx(m)}<td>${dot(m)} ${['Normal','Watch','Alert'][st(m)]}</tr>`).join('')+'</tbody>').join('')+'</table></div>';
const LN={C:['Continuous','streams every 1 s'],P:['Periodic','sampled every ~10 s (demo time)'],S:['Scheduled / long-term','assessed every ~30 s (demo time)']};
const U4=()=>'<div class="lanes">'+['C','P','S'].map(t=>`<div class="lane"><h2>${LN[t][0]}<small>${LN[t][1]}</small></h2>`+CATS.map((c,i)=>{const a=by(i).filter(m=>m.t==t);return a.length?`<div class="card"><h3>${c[0]} ${c[1]}</h3>`+a.map(m=>`<div class="row">${dot(m)}<span class="n">${m.n}</span><span class="val">${fv(m)} <small>${m.u}</small></span></div>`).join('')+'</div>':''}).join('')+'</div>').join('')+'</div>';
const U5=()=>'<div class="grid5">'+CATS.map((c,i)=>{const a=by(i),ok=a.filter(m=>st(m)==0).length/a.length*100;return `<section class="card"><div class="ringrow"><div class="ring" style="--p:${ok}"><span>${c[0]}</span></div><h3>${c[1]}<small>${Math.round(ok)}% in range</small></h3></div><div class="chips">`+a.map(m=>`<div class="chip s${st(m)} ${now-m.l<1&&m.t!='C'?'fl':''}"><small>${m.n}</small><b>${fv(m)}</b><small>${m.u}</small></div>`).join('')+'</div></section>'}).join('')+'</div>';
const UIS=[['Console',U1],['Focus',U2],['Matrix',U3],['Lanes',U4],['Pulse',U5]];
function mark(){document.querySelectorAll('[data-u]').forEach(b=>b.classList.toggle('on',+b.dataset.u==ui));document.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m==mode))}
function render(){hdr();devs();$('#app').innerHTML=UIS[ui][1]();$('#pkt').textContent=pkt?JSON.stringify(pkt):''}
$('#tabs').innerHTML=UIS.map((u,i)=>`<button data-u="${i}">UI ${i+1} · ${u[0]}</button>`).join('');
$('#modes').innerHTML=Object.keys(MD).map(k=>`<button data-m="${k}">${k}</button>`).join('')+'<button id="ps">⏸ Pause</button>';
$('#dv').textContent='📡 Devices ('+Object.keys(DEV).length+')';
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.u!=null)ui=+d.u;if(d.c!=null)sel=+d.c;
 if(d.m){mode=d.m;K.forEach((k,i)=>T[k]=MD[mode][i])}
 if(b.id=='ps'){paused=!paused;b.textContent=paused?'▶ Resume':'⏸ Pause'}
 if(b.id=='ra'||b.id=='mr'){modal();$('#md').classList.add('open')}if(b.id=='mx')$('#md').classList.remove('open');if(b.id=='dv')$('#dr').classList.add('open');if(b.id=='dx')$('#dr').classList.remove('open');
 mark();render()});
$('#md').addEventListener('click',e=>{if(e.target.id=='md')e.currentTarget.classList.remove('open')});
for(let i=0;i<30;i++)step();
mark();render();
setInterval(()=>{if(!paused)step();render()},1000);
</script></body></html>
